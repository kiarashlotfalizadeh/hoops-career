<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe7" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clipboard GM" />
    <meta name="description" content="A basketball GM and head coach game, with a tactics layer that tells you why." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Clipboard GM</title>
    <!-- the look this device keeps (Hardwood or Night Court, or the system's own), on the page before
         anything is drawn: no flash of paper at night while the app's stylesheet loads (ui/theme.ts) -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('cgm:device') || '{}');
        var t = p.theme === 'light' || p.theme === 'dark' ? p.theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      html,
      body {
        background: #f3efe7;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #171512;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
