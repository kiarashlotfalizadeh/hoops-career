name: CI
on:
  push:
    branches: [main]
  pull_request:
  # the seed workflow starts it after committing a new seed (a push with its token starts nothing)
  workflow_dispatch:
permissions:
  contents: read
# a new push to a pull request replaces its running check; every commit on main gets its own result
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: League invariants (multi-season run)
        run: npm run invariants
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test (phone + tablet, backup round trip)
        run: npm run smoke
  # the multi-season star check in a job of its own, beside verify: eight leagues of eight seasons,
  # one per core (about 6 minutes on four cores, 10-12 on two)
  stars:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Star check (eight leagues of eight seasons; no leader over 39 a game or 81-point night, one season at most over 73 wins)
        run: npm run star-check
        env:
          QUIET: '1'
  # no dominant setup: every playbook and shape for every team of the real league against every other
  # team (paired games on fixed seeds), and the staff's picks; fails if one is best for or picked by more
  # than 12 of the 30 teams (scripts/style-gate.ts). In a job of its own, one process per core (about 2
  # minutes on four local cores, 3-4 on the runner's)
  styles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Style gate (no playbook best for or picked by more than 12 of 30 teams, no shape best for more than 14)
        run: npm run style-gate
  # the season forecast against the seasons it forecasts: ten real leagues and six fictional ones from
  # opening night, two seasons each (scripts/forecast-check.ts); fails when its spread, its tails, its
  # 10-90 band or a real team's mean miss break, or the default newcomer team's first season misses its
  # owner's goals. One process per core (about 2 minutes on four local cores, 4-5 on the runner's)
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Forecast check (16 leagues of two seasons; slope 0.9-1.15, the band holding 72-90%, no real team systematically off)
        run: npm run forecast-check
        env:
          QUIET: '1'
