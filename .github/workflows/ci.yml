name: CI
on:
  push:
    branches: [main]
  pull_request:
  # the seed workflow starts it after committing a new seed (a push with its token starts nothing)
  workflow_dispatch:
permissions:
  contents: read
# a new push to a pull request replaces its running check; every commit on main gets its own result
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: League invariants (multi-season run)
        run: npm run invariants
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test (phone + tablet, backup round trip)
        run: npm run smoke
