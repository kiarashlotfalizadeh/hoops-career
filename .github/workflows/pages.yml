# Publishes the PWA to GitHub Pages on every push to main (and by hand from the Actions tab).
# One-time setup: Settings → Pages → Source: "GitHub Actions". (Pages on private repositories needs
# a paid GitHub plan; otherwise make the repo public or deploy dist/ to any static host.)
name: Deploy PWA to Pages
on:
  push:
    branches: [main]
  # by hand, and the seed workflow starts it after committing a new seed (a push with its token starts nothing)
  workflow_dispatch:
permissions:
  contents: read
# one deployment at a time: a newer run waits rather than cutting off one that is publishing
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read # configure-pages reads the site's URL
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # once the game lives at its own address (the repository variable SITE_MOVED_TO, e.g.
      # https://clipboardgm.com, set only after that site is live), this one only forwards there
      - run: npm ci
        if: vars.SITE_MOVED_TO == ''
      # the site's own path: /<repo>/ for a project site, / for a user site or a custom domain
      - run: npm run build
        if: vars.SITE_MOVED_TO == ''
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: node scripts/moved-site.mjs "$SITE_MOVED_TO" dist
        if: vars.SITE_MOVED_TO != ''
        env:
          SITE_MOVED_TO: ${{ vars.SITE_MOVED_TO }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
