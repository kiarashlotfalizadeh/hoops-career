# Publishes the PWA to GitHub Pages on every push to main (and by hand from the Actions tab).
# One-time setup: Settings → Pages → Source: "GitHub Actions". (Pages on private repositories needs
# a paid GitHub plan; otherwise make the repo public or deploy dist/ to any static host.)
name: Deploy PWA to Pages
on:
  push:
    branches: [main]
  # by hand, and the seed workflow starts it after committing a new seed (a push with its token starts nothing)
  workflow_dispatch:
permissions:
  contents: read
# one deployment at a time: a newer run waits rather than cutting off one that is publishing
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read # configure-pages reads the site's URL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      # the site's own path: /<repo>/ for a project site, / for a user site or a custom domain
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
