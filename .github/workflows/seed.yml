# Builds src/data/seed.json on GitHub's runners (open network): Basketball Reference pages
# (contracts, rosters, bios, box scores; ~90 pages at 1 request / 3.7 s) plus NBA.com
# play-by-play / matchup archives and ESPN college box scores from public GitHub datasets, and
# the opening-night extras (NBA.com schedule, RealGM pick ownership, ESPN injuries, two-way
# contracts). Calibrates ratings in the engine, commits the seed to main (runs from main only)
# and then starts the CI and Android APK workflows on it, and stores the Basketball Reference
# pages as a tarball on the `data-raw` branch (the GitHub datasets re-download fast). With
# `extras_only`, it just refreshes the extras in the current seed. A successful build uploads the
# seed as an artifact.
name: Build seed data
on:
  workflow_dispatch:
    inputs:
      commit_seed:
        description: Commit the generated seed.json to main
        type: boolean
        default: true
      extras_only:
        description: Only refresh schedule, pick ownership, injuries and two-way contracts (no stats re-fetch or recalibration)
        type: boolean
        default: false
      refetch:
        description: Ignore the Basketball Reference pages cached on data-raw and fetch them all again
        type: boolean
        default: false
permissions:
  contents: write
  actions: write # starts CI and the APK build on a committed seed
# two runs would race to push the seed to main and the pages to data-raw
concurrency:
  group: seed
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # no token left in .git/config for npm ci and the data scripts: the two push steps authenticate themselves
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse previously fetched pages
        if: ${{ !inputs.extras_only && !inputs.refetch }}
        # fetch-depth 0 already fetched every branch, data-raw included
        run: |
          if git rev-parse --verify -q origin/data-raw >/dev/null; then
            git show origin/data-raw:data-raw.tgz > /tmp/prev.tgz && tar xzf /tmp/prev.tgz || true
          fi
      # contracts and this season's rosters change all summer: --refresh re-fetches them even when cached
      - name: Fetch Basketball Reference pages
        if: ${{ !inputs.extras_only }}
        run: npm run data:fetch -- --refresh
      - name: Fetch NBA.com play-by-play and college data
        if: ${{ !inputs.extras_only }}
        run: npm run data:fetch-nba
      # always fresh: the injury report changes hourly and pick ownership with every trade; --strict
      # fails the run when a source can't be downloaded instead of committing a seed without it
      - name: Fetch schedule, pick ownership, injuries and two-way contracts
        run: npm run data:fetch-extra -- --force --strict
      # also after a failed fetch (rate limits): the pages that did arrive aren't fetched again next time
      - name: Archive raw pages
        id: archive
        if: ${{ !cancelled() && !inputs.extras_only }}
        run: tar czf /tmp/data-raw.tgz --exclude=data/raw/nba --exclude=data/raw/extra data/raw && ls -la /tmp/data-raw.tgz data/raw | head -100
      # allowed to fail so the fetched pages still reach data-raw below; the last step fails the run
      - name: Build seed (parse, derive, calibrate)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "${{ inputs.extras_only }}" = "true" ]; then
            npm run data:extras 2>&1 | tee /tmp/build.log
          else
            npm run data:build 2>&1 | tee /tmp/build.log
          fi
      - name: Verify app still builds and tests pass with the seed
        if: steps.build.outcome == 'success'
        run: npm run typecheck && npm test && npm run invariants && npm run build
      # also when the checks above fail, so the new seed can be inspected
      - name: Upload seed
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seed
          path: src/data/seed.json
      - name: Commit seed to main
        if: steps.build.outcome == 'success' && inputs.commit_seed && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a rebuild that only moved its timestamps isn't worth a commit
          strip='del(.generated, .extrasAsOf)'
          if cmp -s <(git show HEAD:src/data/seed.json | jq -c "$strip") <(jq -c "$strip" src/data/seed.json); then
            echo "seed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/seed.json
          git commit -m "Update seed data"
          # only these two commands get the token, in the header actions/checkout itself uses
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "$auth" pull --rebase origin main
          git -c "$auth" push origin HEAD:main
          # a push made with this token starts no workflows: run CI and the APK build on the new seed
          gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run android.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Push raw pages to data-raw branch
        if: ${{ !cancelled() && !inputs.extras_only && steps.archive.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/data-raw.tgz /tmp/upload.tgz
          git checkout --orphan data-raw-tmp
          git rm -rf --cached . > /dev/null
          cp /tmp/upload.tgz data-raw.tgz
          git add -f data-raw.tgz
          git commit -m "Basketball Reference raw pages $(date -u +%F)"
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "$auth" push -f origin HEAD:data-raw
      - name: Fail the run if the seed build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Building the seed failed: see the 'Build seed' step log."
          exit 1
