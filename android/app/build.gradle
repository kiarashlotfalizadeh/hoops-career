import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// CI signs every build with one fixed key from repository secrets, so a new build installs over the
// old one (and keeps its saves). Without ANDROID_KEYSTORE_FILE, debug builds use Gradle's own debug
// key and release builds refuse to run (see the check at the end).
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
// the version players see is the web app's (package.json), so the store listing and Settings agree
def appVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version

android {
    namespace "com.hoopscareer.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hoopscareer.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Android only installs an update with a versionCode at least the installed one's, and Google
        // Play wants a higher one for every upload: CI passes its run number, which only goes up
        versionCode = (project.findProperty('versionCode') ?: 1) as Integer
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystoreFile) {
            fixed {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (keystoreFile) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreFile) signingConfig signingConfigs.fixed
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// A release build (an APK or the Play bundle) must carry the one key every later update is signed
// with: without it, stop and say why instead of producing a build that can never be updated.
gradle.taskGraph.whenReady { graph ->
    def release = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package|sign)Release.*/ }
    if (!release) return
    def missing = ['ANDROID_KEYSTORE_FILE', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].findAll { !System.getenv(it) }
    if (!missing && !file(keystoreFile).exists()) missing = ["ANDROID_KEYSTORE_FILE (no file at ${keystoreFile})"]
    if (missing) {
        throw new GradleException("A release build needs the release signing key, and these are not set: ${missing.join(', ')}. See README → Ship to phones → Android signing. (Debug builds don't need it: ./gradlew assembleDebug.)")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
